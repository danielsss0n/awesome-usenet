name: Sync datahoarder.io posts into README

on:
  schedule:
    - cron: "0 13 * * *"   # daily, 9am America/New_York (13:00 UTC)
  workflow_dispatch: {}     # lets you trigger it manually from the Actions tab

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run sync script
        run: python sync_datahoarder_posts.py

      - name: Commit changes if any
        run: |
          git config user.name "datahoarder-sync-bot"
          git config user.email "actions@users.noreply.github.com"
          git add README.md last_synced.json
          git diff --cached --quiet || git commit -m "Sync new posts from datahoarder.io"
          git push
